name: Danger Comment

on:
  workflow_run:
    workflows: [Danger]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    uses: danger/danger-pr-comment/.github/workflows/danger-comment.yml@v0.3.0
    secrets: inherit
    with:
      # Don't create comments for empty reports. Existing report comments are still updated.
      comment-empty: false
      # Comment on stacked PRs, whose base is another PR's branch.
      base-branch: '*'
