name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version overriding the checked-in version.
        type: string
        required: false
      dry-run:
        description: Check release prerequisites, such as RubyGems Trusted Publishing, without releasing.
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'dblock/strava-ruby-client' && github.ref == 'refs/heads/master'
    uses: dblock/ruby-gem-release/.github/workflows/release.yml@v0.9.0
    with:
      ruby-version: '3.4'
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      test: |
        bundle exec rake spec
        BUNDLE_GEMFILE=gemfiles/rubocop.gemfile bundle install --jobs 4 --retry 3
        BUNDLE_GEMFILE=gemfiles/rubocop.gemfile bundle exec rubocop
