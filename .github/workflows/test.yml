name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "jruby-9.4"
          - "jruby-10"
        gemfile:
          - Gemfile
        include:
          # See https://github.com/dblock/strava-ruby-client/issues/113: this
          # gem no longer relies on Faraday's built-in :json response
          # middleware, so it works with both json < 3.0 and json >= 3.0.
          - ruby-version: "3.4"
            gemfile: gemfiles/json_2.gemfile
          - ruby-version: "3.4"
            gemfile: gemfiles/json_3.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run Tests
        env:
          RACK_ENV: test
          CI: true
        run: bundle exec rake spec
      - name: Report coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage/lcov.info
          flag-name: ${{ matrix.gemfile == 'Gemfile' && matrix.ruby-version || format('{0}-{1}', matrix.ruby-version, matrix.gemfile) }}
          parallel: true
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run Integration Tests
        run: RACK_ENV=test bundle exec rake spec:integration
  coverage-finished:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Report coverage build as finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
